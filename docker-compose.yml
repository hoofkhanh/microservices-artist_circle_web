#common variables
x-common-environment: &common-env
  EUREKA_HOST: ${EUREKA_HOST}
  EUREKA_PORT: ${EUREKA_PORT}
  USER_SERVICE_URL: ${USER_SERVICE_URL}
  CONFIG_SERVER_HOST: ${CONFIG_SERVER_HOST}
  CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}

services:
  postgres:
    container_name: ms-artist_circle_web-postgres
    image: postgres:16
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - ${POSTGRES_EXTERNAL_PORT}:5432
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
    
  pgadmin:
    container_name: ms-artist_circle_web-pgadmin
    image: dpage/pgadmin4:9.5.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - ${PGADMIN_EXTERNAL_PORT}:80
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
    depends_on:
      - postgres
      
  mongodb:
    container_name: ms-artist_circle_web-mongodb
    image: mongo:8.0.11
    ports:
      - ${MONGO_EXTERNAL_PORT}:27017
    volumes:
      - mongo:/data/db
      - ./temp_volume/mongo/configdb:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
      
  mongo-express:
    container_name: ms-artist_circle_web-mongo_express
    image: mongo-express:1.0.2-18
    ports:
      - ${MONGO_EXPRESS_EXTERNAL_PORT}:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
    depends_on:
      - mongodb
      
  zookeeper:
    container_name: ms-artist_circle_web-zookeeper
    image: confluentinc/cp-zookeeper:7.2.15
    environment:
      ZOOKEEPER_SERVER_ID: ${ZOOKEEPER_SERVER_ID}
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    ports:
      - ${ZOOKEEPER_EXTERNAL_PORT}:2181
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
    volumes:
    - ./temp_volume/zookeeper/data:/var/lib/zookeeper/data       
    - ./temp_volume/zookeeper/log:/var/lib/zookeeper/log        
    - ./temp_volume/zookeeper/secrets:/etc/zookeeper/secrets 
  
  kafka:
    container_name: ms-artist_circle_web-kafka
    image: confluentinc/cp-kafka:7.2.15
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
    ports:
      - ${KAFKA_EXTERNAL_PORT}:9092
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
    depends_on:
      - zookeeper
    volumes:
    - ./temp_volume/kafka/data:/var/lib/kafka/data
    - ./temp_volume/kafka/secrets:/etc/kafka/secrets
      
  mail-dev:
    container_name: ms-artist_circle_web-mail_dev
    image: maildev/maildev:2.2.1
    ports:
      - ${MAILDEV_UI_PORT}:1080
      - ${MAILDEV_SMTP_PORT}:1025
    networks:
      - ms-artist_circle_web-net
    restart: unless-stopped
      
  redis:
    image: redis:8.0.3
    container_name: ms-artist_circle_web-redis
    restart: unless-stopped
    volumes:
      - redis_volume_data:/data
    ports:
      - ${REDIS_EXTERNAL_PORT}:6379
    networks:
      - ms-artist_circle_web-net
      
  redis_insight:
    image: redis/redisinsight:2.70
    container_name: ms-artist_circle_web-redis_insight
    restart: unless-stopped
    ports:
      - ${REDIS_INSIGHT_EXTERNAL_PORT}:5540
    volumes:
      - redis_insight_volume_data:/data
    networks:
      - ms-artist_circle_web-net
      
  elasticsearch:
    container_name: ms-artist_circle_web-es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      - xpack.security.enabled=${ELASTIC_SECURITY_ENABLED}
      - discovery.type=${ELASTIC_DISCOVERY_TYPE}
    networks:
      - ms-artist_circle_web-net
    ports:
      - ${ELASTIC_EXTERNAL_PORT}:9200
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
      
  kibana:
    container_name:  ms-artist_circle_web-kb
    image: docker.elastic.co/kibana/kibana:8.18.0
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOST}
      - xpack.security.enabled=${ELASTIC_SECURITY_ENABLED}
      - xpack.enterpriseSearch.enabled=${ELASTIC_SECURITY_ENABLED}
      - xpack.encryptedSavedObjects.encryptionKey=Zm9vYmFyYmF6cXV4eHl6c2VjdXJla2V5dGhhdHdvcms=
    networks:
      - ms-artist_circle_web-net
    depends_on:
      - elasticsearch
    ports:
      - ${KIBANA_EXTERNAL_PORT}:5601
    restart: unless-stopped
    
  rabbitmq:
    image: rabbitmq:4.1.2-management
    container_name: ms-artist_circle_web-rabbitmq
    ports:
      - ${RABBITMQ_AMQP_EXTERNAL_PORT}:5672
      - ${RABBITMQ_MANAGEMENT_EXTERNAL_PORT}:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
      
# SERVICE IMAGES
  artist-service:
    image: ${ARTIST_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-artist
    ports: 
      -  ${ARTIST_EXTERNAL_PORT}:${ARTIST_SERVER_PORT}
    environment:
      <<: *common-env
      DB_HOST: ${POSTGRES_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${ARTIST_POSTGRES_DB_NAME}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${ARTIST_SERVER_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    depends_on:
      -  config_server-service
      -  discovery-service
    restart: unless-stopped
    
  config_server-service:
    image: ${CONFIG_SERVER_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-config_server
    ports: 
      -  ${CONFIG_SERVER_EXTERNAL_PORT}:${CONFIG_SERVER_PORT}
    environment:
      <<: *common-env
      SERVER_PORT: ${CONFIG_SERVER_PORT}
    restart: unless-stopped
   
  discovery-service:
    image: ${DISCOVERY_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-discovery
    ports: 
      -  ${DISCOVERY_EXTERNAL_PORT}:${EUREKA_PORT} 
    environment:
      <<: *common-env
    depends_on:
      -  config_server-service
    restart: unless-stopped
 
  gateway-service:
    image: ${GATEWAY_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-gateway
    ports: 
      -  ${GATEWAY_EXTERNAL_PORT}:${GATEWAY_PORT}
    environment:
      <<: *common-env
      SERVER_PORT: ${GATEWAY_PORT}
    depends_on:
      -  config_server-service
      -  discovery-service
    restart: unless-stopped
      
  search-service:
    image: ${SEARCH_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-search
    ports: 
      -  ${SEARCH_EXTERNAL_PORT}:${SEARCH_PORT}
    environment:
      <<: *common-env
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      ELASTICSEARCH_URI: ${ELASTICSEARCH_HOST}
      SERVER_PORT: ${SEARCH_PORT}
    depends_on:
      -  config_server-service
      -  discovery-service
    restart: unless-stopped
      
  user-service:
    image: ${USER_IMAGE}:${IMAGE_TAG}
    container_name: ms-artist_circle_web-user
    ports: 
      -  ${USER_EXTERNAL_PORT}:8080
    environment:
      <<: *common-env
      DB_HOST: ${POSTGRES_DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${USER_POSTGRES_DB_NAME}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SERVER_PORT: ${USER_PORT}
    depends_on:
      -  config_server-service
      -  discovery-service
    restart: unless-stopped
      
networks:
  ms-artist_circle_web-net:
    driver: bridge
      
volumes:
  postgres:
  pgadmin:
  mongo:
  redis_volume_data:
  redis_insight_volume_data:
  es_data:
  rabbitmq_data: