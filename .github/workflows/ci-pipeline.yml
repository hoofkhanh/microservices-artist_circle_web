name: Build and Push Changed Microservices

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_TAG: "1.0.0"

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      artist: ${{ steps.filter.outputs.artist }}
      user: ${{ steps.filter.outputs.user }}
      gateway: ${{ steps.filter.outputs.gateway }}
      search: ${{ steps.filter.outputs.search }}
      config_server: ${{ steps.filter.outputs.config_server }}
      discovery: ${{ steps.filter.outputs.discovery }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Filter changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            artist:
              - 'services/microservices-artist_circle_web-artist/**'
              - 'common/**'
              - 'pom.xml'
            user:
              - 'services/microservices-artist_circle_web-user/**'
              - 'common/**'
              - 'pom.xml'
            gateway:
              - 'services/microservices-artist_circle_web-gateway/**'
              - 'common/**'
              - 'pom.xml'
            search:
              - 'services/microservices-artist_circle_web-search/**'
              - 'common/**'
              - 'pom.xml'
            config_server:
              - 'services/microservices-artist_circle_web-config_server/**'
              - 'common/**'
              - 'pom.xml'
            discovery:
              - 'services/microservices-artist_circle_web-discovery/**'
              - 'common/**'
              - 'pom.xml'

  build-and-push:
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [artist, user, gateway, search, config_server, discovery]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Skip if no change for ${{ matrix.service }}
        if: ${{ needs.filter.outputs[matrix.service] != 'true' }}
        run: echo "No changes in ${{ matrix.service }}, skipping..."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and install common module
        if: ${{ needs.filter.outputs[matrix.service] == 'true' }}
        run: mvn clean install -pl common -am -DskipTests

      - name: Run unit tests for ${{ matrix.service }}
        if: ${{ needs.filter.outputs[matrix.service] == 'true' }}
        run: mvn -B test --file services/microservices-artist_circle_web-${{ matrix.service }}/pom.xml

      - name: Log in to Docker Hub
        if: ${{ needs.filter.outputs[matrix.service] == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} Docker image
        if: ${{ needs.filter.outputs[matrix.service] == 'true' }}
        run: |
          docker build -f services/microservices-artist_circle_web-${{ matrix.service }}/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}-service:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}-service:${{ env.IMAGE_TAG }}
